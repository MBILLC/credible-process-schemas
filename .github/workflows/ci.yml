name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The tools are installed non-editable, so they cannot find this checkout as their
      # sibling directory; tell them where it is.
      CREDIBLE_PROCESS_SCHEMAS: ${{ github.workspace }}/credible-process-schemas
    steps:
      - uses: actions/checkout@v4
        with: {path: credible-process-schemas}
      - uses: actions/checkout@v4
        with:
          repository: MBILLC/credible-process-tools
          path: credible-process-tools
          # The tools repo is private: the default GITHUB_TOKEN can only read THIS repo.
          # CROSS_REPO_CI is a token with read access to credible-process-tools.
          token: ${{ secrets.CROSS_REPO_CI }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ./credible-process-tools
      - name: profiles up to date with matrices
        run: csp generate --check
        working-directory: credible-process-schemas
      - name: fixtures
        run: csp fixtures
        working-directory: credible-process-schemas
      - name: worked example
        run: csp check examples/ev-range/DecisionTask.dtmd examples/ev-range/SimulationTask.stmd examples/ev-range/ElectricRange_V2.mtmd examples/ev-range/TorqueControl.mtmd && csp check examples/ev-range/Credibility-Assessment2024-10.srmd --level CL3
        working-directory: credible-process-schemas
